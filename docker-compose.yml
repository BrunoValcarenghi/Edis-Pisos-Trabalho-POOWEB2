services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: edis_pisos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - dados-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/edis_pisos
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  dados-db:
