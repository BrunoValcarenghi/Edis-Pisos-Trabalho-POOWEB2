spring.application.name=edis-pisos

server.port=${SERVER_PORT:8080}
spring.web.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pisos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

security.jwt.secret=${JWT_SECRET:ZWRpcy1waXNvcy1kZXZlbG9wbWVudC1qd3Qtc2VjcmV0LTIwMjYtMzItYnl0ZXM=}
security.jwt.expiration-minutes=${JWT_DURATION_MINUTES:120}
